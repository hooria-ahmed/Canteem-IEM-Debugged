<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Straviam POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC;
            --primary: #3B82F6;
            --text-1: #0F172A;
            --text-4: #94A3B8;
            --border: #E2E8F0;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text-1);
            display: flex; align-items: center; justify-content: center;
            height: 100vh; margin: 0; text-align: center;
        }
        .container { max-width: 450px; padding: 40px; }
        .icon-wrap {
            width: 100px; height: 100px; background: #EFF6FF; color: #3B82F6;
            border-radius: 30px; display: flex; align-items: center; justify-content: center;
            font-size: 48px; margin: 0 auto 32px; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.15);
        }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.02em; }
        p { color: var(--text-4); font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 28px; background: var(--text-1); color: #fff;
            text-decoration: none; border-radius: 14px; font-weight: 700;
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap"><i class="bi bi-search"></i></div>
        <h1>404 — Lost in Space?</h1>
        <p>The page you are looking for doesn't exist or has been moved to a new location in the POS portal.</p>
        <a href="/" class="btn"><i class="bi bi-house-door"></i> Back to Dashboard</a>
    </div>
</body>
</html>
